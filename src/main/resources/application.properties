spring.application.name=f1-bets

# JPA / Hibernate - schema is owned by Flyway, Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# RFC 7807 problem details for framework exceptions (validation, etc.)
spring.mvc.problemdetails.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# openf1.org provider (decoupled behind EventProviderPort)
openf1.base-url=https://api.openf1.org/v1
openf1.connect-timeout=5s
openf1.read-timeout=5s

# Odds quote time-to-live
quote.ttl=5m
